# Poyra yük profili — ELLE tetiklenir, normal CI'a karışmaz.
#
# Neden ayrı workflow: profil dakikalar sürer ve runner donanımına göre oynar. ci.yml'e
# eklenseydi her PR'ı yavaşlatır, üstelik paylaşımlı runner'ın gürültüsü yüzünden
# rastgele kırmızı yanardı. Yük ölçümü bir kapı değil, ARAÇTIR: ne zaman ve hangi
# koşullarda koşacağına insan karar verir.
#
# Yerelde: dotnet run --project tests/Poyra.Tests.Load -- [senaryo] [--sure N] [--es N]
name: Yük profili

on:
  workflow_dispatch:
    inputs:
      senaryo:
        description: 'Senaryo süzgeci (boş = hepsi): rota-karari · odeme-olustur · odeme-confirm'
        required: false
        default: ''
      sure:
        description: 'Senaryo başına ölçüm süresi (saniye)'
        required: false
        default: '30'
      esZamanlilik:
        description: 'Eşzamanlı sanal kullanıcı'
        required: false
        default: '16'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  profil:
    name: Yük profili
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: NuGet önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Release şart: Debug'da JIT eniyilemesi kapalı ve rota çekirdeği ölçümü
      # tamamen anlamsızlaşır (mikrosaniyelik iş, katbekat yavaş görünür).
      - name: Yük profilini koş
        run: |
          dotnet run --project tests/Poyra.Tests.Load -c Release -- \
            ${{ inputs.senaryo }} \
            --sure ${{ inputs.sure }} \
            --es ${{ inputs.esZamanlilik }} \
            --isinma 5
